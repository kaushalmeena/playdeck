<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="playdeck:title" content="Brick Break" />
		<meta name="playdeck:emoji" content="🧱" />
		<meta name="playdeck:desc" content="One ball, one life. Clear the wall." />
		<meta name="playdeck:order" content="29" />
		<meta name="playdeck:accent" content="#ff4d6d" />
		<meta
			name="playdeck:instructions"
			content="Drag (or arrow keys) to move the paddle. Clear every brick — you only get one ball. Catch falling power-ups for multi-ball or a wide paddle, and chain bricks between paddle hits for bigger points."
		/>
		<style>
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<script>
			const canvas = document.getElementById("c");
			const ctx = canvas.getContext("2d");
			const COLS = 7;
			const BH = 20; // brick height
			const GAP = 6;
			const BALL_R = 8;
			const PALETTE = [
				"#ff4d6d",
				"#ff8a1e",
				"#ffd24d",
				"#3dffa0",
				"#00e5ff",
				"#7c5cff",
			];
			const POWERS = {
				multi: { label: "MULTI-BALL!", icon: "×3", colour: "#00e5ff" },
				wide: { label: "WIDE PADDLE!", icon: "↔", colour: "#3dffa0" },
			};

			let W = 0,
				H = 0,
				dpr = 1;
			let state = "idle"; // idle | serve | run | dying | won
			let px = 0.5; // paddle centre as a fraction of width
			let balls = []; // { x, y, vx, vy }
			let bricks = []; // { x, y, w, c, row, col, boom, alive }
			let drops = []; // falling power-ups { x, y, kind }
			let blasts = []; // expanding rings from explosive bricks
			let total = 0,
				destroyed = 0,
				score = 0,
				chain = 0,
				hits = 0,
				dropsSeen = 0;
			let basePW = 110,
				baseSpeed = 320,
				wideUntil = 0,
				serveAt = 0;
			let keyDir = 0;
			let raf = 0,
				endTimer = 0;
			let ink = "#eaeaf2";

			function themeVar(name, fallback) {
				return (
					getComputedStyle(document.documentElement)
						.getPropertyValue(name)
						.trim() || fallback
				);
			}

			// wall layout depends on the width, so it's rebuilt on resize (alive flags kept)
			function layoutBricks() {
				const wallW = Math.min(W - 32, 460);
				const bw = (wallW - (COLS - 1) * GAP) / COLS;
				const left = (W - wallW) / 2;
				bricks.forEach((b, i) => {
					const row = Math.floor(i / COLS),
						col = i % COLS;
					b.x = left + col * (bw + GAP);
					b.y = 112 + row * (BH + GAP);
					b.w = bw;
				});
			}

			function resize() {
				dpr = Math.min(devicePixelRatio || 1, 2);
				W = innerWidth;
				H = innerHeight;
				canvas.width = W * dpr;
				canvas.height = H * dpr;
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				layoutBricks();
			}
			addEventListener("resize", resize);
			resize();

			// paddle sits above the caption zone
			const padY = () => H - 130;
			const paddleW = (now) => basePW * (now < wideUntil ? 1.6 : 1);
			// the ball gets quicker as the wall thins out
			const ballSpeed = () => baseSpeed * (1 + Math.min(hits * 0.02, 0.45));

			function hud() {
				const third =
					chain >= 2
						? `CHAIN ×${Math.min(chain, 5)}`
						: balls.length > 1
							? `⚪ ×${balls.length}`
							: null;
				playdeck.hud({
					chips: [
						`🧱 ${total - destroyed} LEFT`,
						`${score} PTS`,
						...(third ? [third] : []),
					],
				});
			}

			playdeck.onStart(({ level }) => {
				clearTimeout(endTimer);
				cancelAnimationFrame(raf);
				ink = themeVar("--t-text", "#eaeaf2");
				const lv = Math.min(level, 12);
				const rows = Math.min(2 + lv, 6);
				basePW = Math.max(110 - lv * 4, 72);
				baseSpeed = 360 + lv * 18;
				px = 0.5;
				bricks = [];
				for (let row = 0; row < rows; row++)
					for (let col = 0; col < COLS; col++)
						bricks.push({
							x: 0,
							y: 0,
							w: 0,
							c: PALETTE[row % PALETTE.length],
							row,
							col,
							boom: false,
							alive: true,
						});
				// two explosive bricks per row: each blows up its neighbours (and chains)
				for (let row = 0; row < rows; row++) {
					const a = (Math.random() * COLS) | 0;
					const b = (a + 2 + ((Math.random() * (COLS - 3)) | 0)) % COLS;
					bricks[row * COLS + a].boom = true;
					bricks[row * COLS + b].boom = true;
				}
				layoutBricks();
				total = bricks.length;
				destroyed = 0;
				score = 0;
				chain = 0;
				hits = 0;
				dropsSeen = 0;
				drops = [];
				blasts = [];
				wideUntil = 0;
				keyDir = 0;
				balls = [{ x: W / 2, y: padY() - BALL_R - 2, vx: 0, vy: 0 }];
				// the ball rides the paddle for a moment, then launches (or tap to launch)
				state = "serve";
				serveAt = performance.now() + 900;
				hud();

				let last = performance.now();
				const loop = (now) => {
					const dt = Math.min((now - last) / 1000, 0.04);
					last = now;
					step(dt, now);
					draw(now);
					if (state !== "idle") raf = requestAnimationFrame(loop);
				};
				raf = requestAnimationFrame(loop);
			});

			playdeck.onStop(() => {
				state = "idle";
				clearTimeout(endTimer);
				cancelAnimationFrame(raf);
				ctx.clearRect(0, 0, W, H);
			});

			function launch() {
				if (state !== "serve") return;
				state = "run";
				const a = (Math.random() - 0.5) * (Math.PI / 3.5); // up to ~25° off vertical
				const s = ballSpeed();
				balls[0].vx = Math.sin(a) * s;
				balls[0].vy = -Math.cos(a) * s;
				playdeck.sfx("bounce");
			}

			function step(dt, now) {
				if (keyDir)
					px = Math.min(
						Math.max(px + (keyDir * dt * 1.4 * Math.min(W, 600)) / W, 0.06),
						0.94,
					);
				if (state === "serve") {
					balls[0].x = px * W;
					balls[0].y = padY() - BALL_R - 2;
					if (now >= serveAt) launch();
					return;
				}
				if (state !== "run") return;

				const pw = paddleW(now);
				const padX = px * W,
					py = padY();

				// power-ups fall and are caught by the paddle
				drops = drops.filter((d) => {
					d.y += 170 * dt;
					if (
						d.y > py - 10 &&
						d.y < py + 22 &&
						Math.abs(d.x - padX) < pw / 2 + 14
					) {
						applyPower(d, now);
						return false;
					}
					return d.y < H + 30;
				});

				// substeps so a fast ball can't tunnel through a brick
				const steps = Math.max(1, Math.ceil((ballSpeed() * dt) / 5));
				const sdt = dt / steps;
				for (let s = 0; s < steps && state === "run"; s++) {
					for (const b of balls) moveBall(b, sdt, now, padX, py, pw);
					balls = balls.filter((b) => b.y < H + 20);
					if (!balls.length) return die(now);
				}
			}

			function moveBall(b, dt, now, padX, py, pw) {
				b.x += b.vx * dt;
				b.y += b.vy * dt;
				if (b.x < BALL_R) {
					b.x = BALL_R;
					b.vx = Math.abs(b.vx);
				}
				if (b.x > W - BALL_R) {
					b.x = W - BALL_R;
					b.vx = -Math.abs(b.vx);
				}
				if (b.y < 96 + BALL_R) {
					// ceiling sits just under the HUD
					b.y = 96 + BALL_R;
					b.vy = Math.abs(b.vy);
				}

				// paddle: the hit point steers the bounce angle
				if (
					b.vy > 0 &&
					b.y + BALL_R >= py &&
					b.y - BALL_R <= py + 12 &&
					Math.abs(b.x - padX) < pw / 2 + BALL_R
				) {
					const off = Math.max(-1, Math.min(1, (b.x - padX) / (pw / 2)));
					const a = off * (Math.PI / 3); // up to 60° off vertical
					const s = ballSpeed();
					b.vx = Math.sin(a) * s;
					b.vy = -Math.cos(a) * s;
					b.y = py - BALL_R;
					if (chain >= 3)
						playdeck.pop(
							padX,
							py - 30,
							`CHAIN ×${Math.min(chain, 5)} DONE`,
							"#ffd24d",
						);
					chain = 0;
					playdeck.sfx("bounce");
					hud();
				}

				// bricks: circle vs box, bounce off the shallower overlap axis
				for (const br of bricks) {
					if (!br.alive) continue;
					const nx = Math.max(br.x, Math.min(b.x, br.x + br.w));
					const ny = Math.max(br.y, Math.min(b.y, br.y + BH));
					const dx = b.x - nx,
						dy = b.y - ny;
					if (dx * dx + dy * dy >= BALL_R * BALL_R) continue;
					const overlapX = Math.min(
						b.x + BALL_R - br.x,
						br.x + br.w - (b.x - BALL_R),
					);
					const overlapY = Math.min(
						b.y + BALL_R - br.y,
						br.y + BH - (b.y - BALL_R),
					);
					if (overlapX < overlapY)
						b.vx = b.x < br.x + br.w / 2 ? -Math.abs(b.vx) : Math.abs(b.vx);
					else b.vy = b.y < br.y + BH / 2 ? -Math.abs(b.vy) : Math.abs(b.vy);
					smash(br, now);
					// keep speed in step with the ramp
					const s = ballSpeed() / Math.hypot(b.vx, b.vy);
					b.vx *= s;
					b.vy *= s;
					break;
				}
			}

			function smash(br, now) {
				if (!br.alive) return;
				br.alive = false;
				destroyed += 1;
				hits += 1;
				chain += 1;
				const m = Math.min(chain, 5);
				const pts = 6 * m;
				score += pts;
				const x = br.x + br.w / 2,
					y = br.y + BH / 2;
				playdeck.burst(x, y, br.c, 10);
				playdeck.pop(x, y - 14, `+${pts}`, br.c);
				if (chain >= 2) playdeck.sfx("merge", 2 ** Math.min(chain, 11));
				else playdeck.sfx("hit");

				// power-up drops: random, with a pity drop if none has shown by brick 4
				const left = total - destroyed;
				if (
					left > 2 &&
					(Math.random() < 0.2 || (dropsSeen === 0 && destroyed >= 4))
				) {
					dropsSeen += 1;
					const kind =
						balls.length > 1 || Math.random() < 0.4 ? "wide" : "multi";
					drops.push({ x, y, kind });
				}

				if (br.boom) {
					playdeck.burst(x, y, "#ff8a1e", 30);
					playdeck.pop(x, y - 34, "BOOM!", "#ff8a1e");
					playdeck.shake(2);
					blasts.push({ x, y, t: now });
					// take out all 8 neighbours — explosive ones set off their own blast
					for (const nb of bricks)
						if (
							nb.alive &&
							Math.abs(nb.row - br.row) <= 1 &&
							Math.abs(nb.col - br.col) <= 1
						)
							smash(nb, now);
				}
				hud();
				if (destroyed >= total && state === "run") win(now, x, y);
			}

			function applyPower(d, now) {
				const p = POWERS[d.kind];
				const py = padY();
				playdeck.sfx("collect");
				playdeck.burst(d.x, py, p.colour, 20);
				playdeck.pop(d.x, py - 40, p.label, p.colour);
				if (d.kind === "wide") {
					wideUntil = now + 8000;
				} else {
					// two clones of the highest ball, fanned out
					const src = balls.reduce((a, b) => (b.y < a.y ? b : a), balls[0]);
					const s = ballSpeed();
					for (const turn of [-0.45, 0.45]) {
						const a = Math.atan2(src.vx, -src.vy) + turn;
						balls.push({
							x: src.x,
							y: src.y,
							vx: Math.sin(a) * s,
							vy: -Math.abs(Math.cos(a) * s),
						});
					}
				}
				hud();
			}

			function die(now) {
				state = "dying";
				const x = px * W,
					y = padY();
				playdeck.sfx("boom");
				playdeck.burst(x, y, "#ff4d6d", 30);
				playdeck.shake(3);
				playdeck.flash("#ff4d6d");
				hud();
				endTimer = setTimeout(() => {
					state = "idle";
					cancelAnimationFrame(raf);
					playdeck.end(
						false,
						score,
						`Ball lost · ${total - destroyed} bricks left`,
					);
				}, 800);
			}

			function win(now, x, y) {
				state = "won";
				playdeck.flash("#3dffa0");
				playdeck.sfx("good");
				playdeck.burst(x, y, "#3dffa0", 40);
				playdeck.shake(1);
				playdeck.pop(W / 2, H * 0.45, "WALL CLEARED!", "#3dffa0");
				endTimer = setTimeout(() => {
					state = "idle";
					cancelAnimationFrame(raf);
					playdeck.end(true, score + 30, "Wall cleared");
				}, 650);
			}

			function draw(now) {
				ctx.clearRect(0, 0, W, H);
				// the last few bricks glow so they're easy to hunt down
				const fewLeft = total - destroyed <= 3;
				for (const br of bricks) {
					if (!br.alive) continue;
					ctx.save();
					if (fewLeft) {
						ctx.shadowColor = br.c;
						ctx.shadowBlur = 14 + Math.sin(now / 120) * 6;
					}
					ctx.fillStyle = br.c;
					ctx.beginPath();
					ctx.roundRect(br.x, br.y, br.w, BH, 5);
					ctx.fill();
					ctx.restore();
					if (br.boom) {
						// explosive bricks: dark core with a throbbing spark
						ctx.fillStyle = "#101018";
						ctx.beginPath();
						ctx.roundRect(br.x + 3, br.y + 3, br.w - 6, BH - 6, 3);
						ctx.fill();
						ctx.fillStyle = br.c;
						ctx.font = "900 13px system-ui, sans-serif";
						ctx.textAlign = "center";
						ctx.textBaseline = "middle";
						ctx.globalAlpha = 0.75 + Math.sin(now / 110) * 0.25;
						ctx.fillText("✸", br.x + br.w / 2, br.y + BH / 2 + 1);
						ctx.globalAlpha = 1;
					}
				}
				blasts = blasts.filter((b) => now - b.t < 450);
				for (const b of blasts) {
					const k = (now - b.t) / 450;
					ctx.strokeStyle = `rgba(255,138,30,${1 - k})`;
					ctx.lineWidth = 5 * (1 - k) + 1;
					ctx.beginPath();
					ctx.arc(b.x, b.y, 10 + k * 70, 0, Math.PI * 2);
					ctx.stroke();
				}
				for (const d of drops) {
					const p = POWERS[d.kind];
					ctx.save();
					ctx.shadowColor = p.colour;
					ctx.shadowBlur = 16;
					ctx.fillStyle = p.colour;
					ctx.beginPath();
					ctx.roundRect(d.x - 18, d.y - 10, 36, 20, 10);
					ctx.fill();
					ctx.restore();
					ctx.fillStyle = "#101018";
					ctx.font = "900 12px system-ui, sans-serif";
					ctx.textAlign = "center";
					ctx.textBaseline = "middle";
					ctx.fillText(p.icon, d.x, d.y + 1);
				}
				if (state !== "dying") {
					const pw = paddleW(now);
					const wide = now < wideUntil;
					// flicker in the last second of the wide paddle
					const ending =
						wide && wideUntil - now < 1000 && Math.floor(now / 100) % 2 === 0;
					ctx.save();
					if (wide) {
						ctx.shadowColor = "#3dffa0";
						ctx.shadowBlur = 14;
					}
					ctx.fillStyle = wide && !ending ? "#3dffa0" : ink;
					ctx.beginPath();
					ctx.roundRect(px * W - pw / 2, padY(), pw, 12, 6);
					ctx.fill();
					ctx.restore();
				}
				for (const b of balls) {
					if (state === "dying") break;
					ctx.save();
					ctx.shadowColor = "#00e5ff";
					ctx.shadowBlur = 16;
					ctx.fillStyle = ink;
					ctx.beginPath();
					ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
					ctx.fill();
					ctx.restore();
				}
			}

			function move(e) {
				if (state === "idle" || !playdeck.running) return;
				px = Math.min(Math.max(e.clientX / W, 0.06), 0.94);
			}
			canvas.addEventListener("pointerdown", (e) => {
				if (!playdeck.running) return;
				canvas.setPointerCapture(e.pointerId);
				move(e);
			});
			canvas.addEventListener("pointerup", () => {
				// releasing a tap during the serve launches straight away
				if (playdeck.running) launch();
			});
			canvas.addEventListener("pointermove", move);

			addEventListener("keydown", (e) => {
				if (e.key === "ArrowLeft" || e.key === "a") keyDir = -1;
				else if (e.key === "ArrowRight" || e.key === "d") keyDir = 1;
				else if (e.code === "Space") launch();
				else return;
				e.preventDefault();
			});
			addEventListener("keyup", (e) => {
				if ((e.key === "ArrowLeft" || e.key === "a") && keyDir < 0) keyDir = 0;
				if ((e.key === "ArrowRight" || e.key === "d") && keyDir > 0) keyDir = 0;
			});
		</script>
	</body>
</html>
