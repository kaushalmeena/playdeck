<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="playdeck:title" content="Number Order" />
		<meta name="playdeck:emoji" content="🔢" />
		<meta
			name="playdeck:desc"
			content="Tap 1, 2, 3… faster than you can count."
		/>
		<meta name="playdeck:order" content="26" />
		<meta name="playdeck:accent" content="#7c5cff" />
		<meta
			name="playdeck:instructions"
			content="Tap the numbers in ascending order — the timer refills on every right tap. Clear three boards. One wrong tap ends it."
		/>
		<style>
			:root {
				--accent: #7c5cff;
			}
			/* ---- shared arcade layout: combo, per-answer timer, tiles ---- */
			#game {
				position: absolute;
				inset: 92px 16px 92px;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
			}
			#combo {
				display: flex;
				align-items: baseline;
				gap: 10px;
				height: 56px;
				font-weight: 900;
				color: var(--t-muted);
				transition: color 0.2s;
			}
			#combo b {
				display: inline-block;
				font-size: 50px;
				line-height: 1;
			}
			#combo span {
				font-size: 13px;
				letter-spacing: 0.2em;
			}
			#combo.hot {
				color: var(--accent);
				text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
			}
			#combo.bump b {
				animation: bump 0.35s cubic-bezier(0.3, 1.8, 0.5, 1);
			}
			@keyframes bump {
				from {
					transform: scale(1.8);
				}
			}
			#tbar {
				width: min(84vw, 400px);
				height: 8px;
				border-radius: 99px;
				background: color-mix(in srgb, var(--t-line) 80%, transparent);
				overflow: hidden;
				transition: opacity 0.2s;
			}
			#tbar i {
				display: block;
				height: 100%;
				background: var(--accent);
				border-radius: inherit;
				transform-origin: left;
			}
			#tbar.low i {
				background: var(--t-danger);
			}
			#tbar.off {
				opacity: 0.3;
			}
			.tile {
				animation: pin 0.3s cubic-bezier(0.3, 1.6, 0.5, 1) both;
				animation-delay: calc(var(--i, 0) * 30ms);
			}
			@keyframes pin {
				from {
					transform: scale(0.2);
					opacity: 0;
				}
			}
			.tile.hit {
				animation: hit 0.25s ease-out;
			}
			@keyframes hit {
				40% {
					transform: scale(1.14);
				}
			}
			.tile.wrong {
				animation: wrong 0.4s;
			}
			/* only a tapped button turns red; text and grids just shake */
			button.wrong {
				border-color: var(--t-danger) !important;
				background: color-mix(
					in srgb,
					var(--t-danger) 40%,
					transparent
				) !important;
			}
			@keyframes wrong {
				20% {
					transform: translateX(-10px);
				}
				40% {
					transform: translateX(9px);
				}
				60% {
					transform: translateX(-6px);
				}
				80% {
					transform: translateX(4px);
				}
			}

			/* ---- this game ---- */
			#board {
				font-size: 13px;
				font-weight: 800;
				letter-spacing: 0.25em;
				color: var(--t-muted);
				height: 16px;
			}
			#grid {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: 10px;
				width: min(86vw, 400px, calc(100vh - 320px));
			}
			.num {
				aspect-ratio: 1;
				padding: 0;
				font: inherit;
				font-size: 26px;
				font-weight: 900;
				color: var(--t-text);
				background: var(--t-card);
				border: 2px solid var(--t-line);
				border-radius: 16px;
				cursor: pointer;
				transition:
					opacity 0.25s,
					background 0.2s;
			}
			.num.done {
				opacity: 0.35;
				color: var(--t-good);
				border-color: var(--t-good);
				background: color-mix(in srgb, var(--t-good) 15%, transparent);
			}
			.num.right {
				border-color: var(--t-good);
				box-shadow: 0 0 0 3px var(--t-good);
			}
		</style>
	</head>
	<body>
		<div id="game">
			<div id="combo" aria-live="polite"></div>
			<div id="tbar" class="off"><i></i></div>
			<div id="board"></div>
			<div id="grid"></div>
		</div>
		<script>
			// ---------- shared arcade kit (combo, per-answer timer, juice) ----------
			const $ = (id) => document.getElementById(id);
			const ACCENT = "#7c5cff",
				GOLD = "#ffd24d";
			const comboEl = $("combo"),
				barEl = $("tbar"),
				barFill = barEl.firstElementChild;
			let state = "idle"; // idle | play (answer clock running) | wait | over
			let timers = [],
				raf = 0;
			let score = 0,
				streak = 0,
				best = 0;
			let limit = 1,
				askedAt = 0; // per-answer clock: seconds allowed, start time (ms)

			const after = (ms, fn) => timers.push(setTimeout(fn, ms));
			function clearAll() {
				timers.forEach(clearTimeout);
				timers = [];
				cancelAnimationFrame(raf);
			}
			function center(el) {
				const r = el.getBoundingClientRect();
				return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
			}
			function retrigger(el, cls) {
				el.classList.remove(cls);
				void el.offsetWidth; // restart the CSS animation
				el.classList.add(cls);
			}
			// ×1 → ×5, one step every 3 answers in a row
			const mult = () => Math.min(1 + Math.floor(streak / 3), 5);
			function drawCombo(bump) {
				comboEl.innerHTML = `<b>×${mult()}</b><span>STREAK ${streak}</span>`;
				comboEl.className = (mult() > 1 ? "hot " : "") + (bump ? "bump" : "");
			}
			function arm(seconds) {
				limit = seconds;
				askedAt = performance.now();
				barEl.classList.remove("off", "low");
				barFill.style.transform = "scaleX(1)";
				state = "play";
			}
			function loop(now) {
				if (state === "idle") return;
				if (state === "play") {
					const left = 1 - (now - askedAt) / 1000 / limit;
					barFill.style.transform = `scaleX(${Math.max(left, 0)})`;
					barEl.classList.toggle("low", left < 0.3);
					if (left <= 0) timeout();
				}
				raf = requestAnimationFrame(loop);
			}
			// Correct answer: score with the streak multiplier, +N pop, burst, FAST!
			function reward(el, base, color = ACCENT, sound = true) {
				const took = (performance.now() - askedAt) / 1000;
				const fast = took < limit * 0.35;
				const before = mult();
				streak += 1;
				best = Math.max(best, streak);
				const pts = base * mult() + (fast ? 5 : 0);
				score += pts;
				const { x, y } = center(el);
				if (sound) playdeck.sfx("merge", 2 ** Math.min(streak + 1, 11)); // pitch climbs with the streak
				playdeck.pop(x, y - 10, `+${pts}`, color);
				playdeck.burst(x, y, color, 10 + mult() * 3);
				if (fast) after(100, () => playdeck.pop(x, y - 50, "FAST!", GOLD));
				if (mult() > before) {
					const c = center(comboEl);
					playdeck.pop(c.x, c.y + 40, `×${mult()} COMBO!`, ACCENT);
				}
				retrigger(el, "hit");
				drawCombo(true);
				state = "wait";
				barEl.classList.add("off");
				return fast;
			}
			// Fatal mistake: shake, let it register for a beat, then end.
			function fail(el, note) {
				state = "over";
				barEl.classList.add("off");
				playdeck.sfx("bad");
				if (el) retrigger(el, "wrong");
				after(750, () => {
					state = "idle";
					playdeck.end(false, score, note);
				});
			}
			function win(bonus, note) {
				state = "over";
				score += bonus;
				barEl.classList.add("off");
				playdeck.flash(ACCENT);
				playdeck.sfx("good");
				after(400, () => {
					state = "idle";
					playdeck.end(true, score, note);
				});
			}

			// ---------- Number Order ----------
			const BOARDS = 3;
			const gridEl = $("grid"),
				boardEl = $("board");
			let L = 1,
				board = 0,
				count = 0,
				next = 1;

			const shuffle = (arr) =>
				arr
					.map((v) => [Math.random(), v])
					.sort((a, b) => a[0] - b[0])
					.map((p) => p[1]);
			const tapWindow = () => Math.max(2.2 - L * 0.08, 1.1);

			function hud() {
				playdeck.hud({
					chips: [
						`BOARD ${board + 1}/${BOARDS}`,
						`NEXT ${next}`,
						`${score} PTS`,
					],
				});
			}

			// Each board is two tiles bigger than the last.
			function deal() {
				count = Math.min(5 + L + board * 2, 16);
				next = 1;
				boardEl.textContent = `BOARD ${board + 1} · 1 → ${count}`;
				gridEl.innerHTML = "";
				shuffle(Array.from({ length: count }, (_, i) => i + 1)).forEach(
					(n, i) => {
						const b = document.createElement("button");
						b.type = "button";
						b.className = "tile num";
						b.style.setProperty("--i", i * 0.6);
						b.textContent = n;
						b.dataset.n = n;
						b.setAttribute("aria-label", `Number ${n}`);
						gridEl.append(b);
					},
				);
				arm(tapWindow() + 0.6); // a little extra to scan a fresh board
				hud();
			}

			function tap(b) {
				if (!playdeck.running || state !== "play" || !b) return;
				const n = +b.dataset.n;
				if (n < next) return; // already cleared — harmless
				if (n !== next) {
					gridEl.querySelector(`[data-n="${next}"]`).classList.add("right");
					return fail(b, `Skipped ${next}`);
				}
				reward(b, 2);
				b.classList.add("done");
				next += 1;
				if (next <= count) {
					arm(tapWindow());
					hud();
					return;
				}
				// board cleared
				board += 1;
				const { x, y } = center(gridEl);
				if (board >= BOARDS)
					return win(30 + best, `3 boards cleared! Streak ${best}`);
				playdeck.sfx("good");
				playdeck.pop(x, y, "CLEAR!", ACCENT);
				hud();
				after(420, deal);
			}

			function timeout() {
				gridEl.querySelector(`[data-n="${next}"]`).classList.add("right");
				fail(
					gridEl.querySelector(`[data-n="${next}"]`),
					`Lost track at ${next}`,
				);
			}

			gridEl.addEventListener("pointerdown", (e) =>
				tap(e.target.closest("button")),
			);

			playdeck.onStart(({ level }) => {
				clearAll();
				L = Math.min(Math.max(level, 1), 10);
				score = streak = best = board = 0;
				drawCombo(false);
				deal();
				raf = requestAnimationFrame(loop);
			});

			playdeck.onStop(() => {
				clearAll();
				state = "idle";
				barEl.classList.add("off");
				gridEl.innerHTML = "";
				boardEl.textContent = "";
			});
		</script>
	</body>
</html>
