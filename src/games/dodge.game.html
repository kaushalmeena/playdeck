<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="playdeck:title" content="Dodge Rush" />
		<meta name="playdeck:emoji" content="🏃" />
		<meta
			name="playdeck:desc"
			content="Three lanes. Falling blocks. Survive."
		/>
		<meta name="playdeck:order" content="13" />
		<meta name="playdeck:accent" content="#00e5ff" />
		<meta
			name="playdeck:instructions"
			content="Tap the left or right half of the screen — or use the arrow keys — to switch lanes. Dodge the falling blocks for 15 seconds. Grab gems and slip out of a block's way at the last moment for bonus points."
		/>
		<style>
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<script>
			const canvas = document.getElementById("c");
			const ctx = canvas.getContext("2d");
			const DURATION = 15;
			const BLOCK = 44; // block size
			const PR = 16; // player radius

			let W = 0,
				H = 0,
				dpr = 1;
			let state = "idle"; // idle | run | dying | won
			let lane = 1,
				prevLane = 1,
				laneChangedAt = -1,
				px = 0; // drawn x, eases toward the lane
			let blocks = [],
				gems = [],
				shards = [];
			let t = 0,
				sinceSpawn = 0,
				sinceGem = 0,
				baseSpeed = 300,
				baseSpawn = 0.8,
				doubleChance = 0,
				lastLane = -1;
			let bonus = 0,
				gemCount = 0,
				closes = 0,
				hudAt = 0,
				announcedFaster = false;
			let raf = 0,
				endTimer = 0;
			let ink = "#eaeaf2";

			function themeVar(name, fallback) {
				return (
					getComputedStyle(document.documentElement)
						.getPropertyValue(name)
						.trim() || fallback
				);
			}

			function resize() {
				dpr = Math.min(devicePixelRatio || 1, 2);
				W = innerWidth;
				H = innerHeight;
				canvas.width = W * dpr;
				canvas.height = H * dpr;
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
			}
			addEventListener("resize", resize);
			resize();

			// lanes stay a sensible width on wide screens
			const laneGap = () => Math.min(W * 0.25, 130);
			const laneX = (l) => W / 2 + (l - 1) * laneGap();
			// the player sits above the caption zone
			const playerY = () => H - 160;

			function score() {
				return Math.floor(t) * 8 + bonus;
			}

			function hud(now, force) {
				if (!force && now - hudAt < 150) return;
				hudAt = now;
				const left = Math.max(DURATION - t, 0);
				playdeck.hud({
					chips: [
						`${Math.ceil(left)}s LEFT`,
						`${score()} PTS`,
						...(gemCount ? [`💎 ${gemCount}`] : []),
					],
					progress: left / DURATION,
				});
			}

			playdeck.onStart(({ level }) => {
				clearTimeout(endTimer);
				cancelAnimationFrame(raf);
				ink = themeVar("--t-text", "#eaeaf2");
				const lv = Math.min(level, 12);
				baseSpeed = (Math.max(H, 500) / 2.4) * (1 + lv * 0.08);
				baseSpawn = Math.max(0.8 - lv * 0.04, 0.38);
				// two-block rows show up from level 2 (and late in the run at level 1)
				doubleChance = Math.min(0.15 + (lv - 1) * 0.06, 0.4);
				lane = prevLane = 1;
				laneChangedAt = -1;
				px = laneX(1);
				blocks = [];
				gems = [];
				shards = [];
				t = 0;
				sinceSpawn = 0;
				sinceGem = 0;
				lastLane = -1;
				bonus = 0;
				gemCount = 0;
				closes = 0;
				announcedFaster = false;
				state = "run";
				hud(0, true);

				let last = performance.now();
				const loop = (now) => {
					const dt = Math.min((now - last) / 1000, 0.04);
					last = now;
					step(dt, now);
					draw(now);
					if (state !== "idle") raf = requestAnimationFrame(loop);
				};
				raf = requestAnimationFrame(loop);
			});

			playdeck.onStop(() => {
				state = "idle";
				clearTimeout(endTimer);
				cancelAnimationFrame(raf);
				ctx.clearRect(0, 0, W, H);
			});

			function step(dt, now) {
				for (const s of shards) {
					s.x += s.vx * dt;
					s.y += s.vy * dt;
					s.vy += 800 * dt;
					s.life -= dt;
				}
				px += (laneX(lane) - px) * Math.min(dt * 22, 1);
				if (state !== "run") return;

				t += dt;
				// the whole run accelerates: up to 1.5× speed by the final second
				const ramp = 1 + 0.5 * (t / DURATION);
				const speed = baseSpeed * ramp;
				if (!announcedFaster && t > DURATION / 2) {
					announcedFaster = true;
					playdeck.pop(W / 2, H * 0.35, "FASTER!", "#ff8a1e");
					playdeck.sfx("pop");
				}

				sinceSpawn += dt;
				if (sinceSpawn >= baseSpawn / (1 + 0.3 * (t / DURATION))) {
					sinceSpawn = 0;
					const allowDouble = playdeck.level >= 2 || t > DURATION * 0.45;
					if (allowDouble && Math.random() < doubleChance) {
						// keep the gap out of the lane the previous single block fell in
						const opts = [0, 1, 2].filter((l) => l !== lastLane);
						const open = opts[(Math.random() * opts.length) | 0];
						lastLane = -1;
						for (let l = 0; l < 3; l++)
							if (l !== open) blocks.push({ lane: l, y: -40, passed: false });
						// give the player a beat to reach the gap before the next row
						sinceSpawn = -0.28;
					} else {
						lastLane = (Math.random() * 3) | 0;
						blocks.push({ lane: lastLane, y: -40, passed: false });
					}
				}
				sinceGem += dt;
				if (sinceGem > 1.8) {
					sinceGem = Math.random() * 0.6;
					// drop a gem in a lane with nothing close above the screen top
					const free = [0, 1, 2].filter(
						(l) => !blocks.some((b) => b.lane === l && b.y < 60),
					);
					if (free.length)
						gems.push({
							lane: free[(Math.random() * free.length) | 0],
							y: -30,
						});
				}

				for (const b of blocks) b.y += speed * dt;
				for (const g of gems) g.y += speed * dt;

				const py = playerY();
				const hitRange = BLOCK / 2 + PR - 4;
				for (const b of blocks) {
					if (b.lane === lane && Math.abs(b.y - py) < hitRange) return die(now);
					// the block slid past — did the player just slip out of its lane?
					if (!b.passed && b.y > py + hitRange) {
						b.passed = true;
						if (
							b.lane === prevLane &&
							b.lane !== lane &&
							t - laneChangedAt < 0.35
						) {
							closes += 1;
							bonus += 10;
							playdeck.pop(laneX(lane), py - 40, "CLOSE! +10", "#ff8a1e");
							playdeck.sfx("pop");
						}
					}
				}
				gems = gems.filter((g) => {
					if (g.lane === lane && Math.abs(g.y - py) < 32) {
						gemCount += 1;
						bonus += 15;
						playdeck.sfx("collect");
						playdeck.burst(laneX(g.lane), py, "#00e5ff", 14);
						playdeck.pop(laneX(g.lane), py - 36, "+15", "#00e5ff");
						return false;
					}
					return g.y < H + 40;
				});
				blocks = blocks.filter((b) => b.y < H + 60);

				hud(now);
				if (t >= DURATION) win(now);
			}

			function die(now) {
				state = "dying";
				const x = laneX(lane),
					y = playerY();
				shards = Array.from({ length: 18 }, () => {
					const a = Math.random() * Math.PI * 2;
					const v = 120 + Math.random() * 300;
					return {
						x,
						y,
						vx: Math.cos(a) * v,
						vy: Math.sin(a) * v - 160,
						life: 0.7 + Math.random() * 0.4,
					};
				});
				playdeck.sfx("boom");
				playdeck.burst(x, y, "#ff4d6d", 30);
				playdeck.shake(3);
				playdeck.flash("#ff4d6d");
				hud(now, true);
				const survived = t.toFixed(1);
				endTimer = setTimeout(() => {
					state = "idle";
					cancelAnimationFrame(raf);
					playdeck.end(false, score(), `Squashed at ${survived}s`);
				}, 800);
			}

			function win(now) {
				state = "won";
				t = DURATION;
				hud(now, true);
				const x = laneX(lane),
					y = playerY();
				playdeck.flash("#3dffa0");
				playdeck.sfx("good");
				playdeck.burst(x, y, "#3dffa0", 40);
				playdeck.pop(W / 2, H * 0.4, "SURVIVED!", "#3dffa0");
				endTimer = setTimeout(() => {
					state = "idle";
					cancelAnimationFrame(raf);
					playdeck.end(
						true,
						score() + playdeck.level * 10,
						closes
							? `${closes} close shaves`
							: gemCount
								? `${gemCount} gems grabbed`
								: "Untouched",
					);
				}, 600);
			}

			function draw(now) {
				ctx.clearRect(0, 0, W, H);
				// lane dividers
				ctx.strokeStyle = "rgba(124,92,255,0.25)";
				ctx.lineWidth = 2;
				for (const d of [-0.5, 0.5]) {
					const x = W / 2 + d * laneGap();
					ctx.beginPath();
					ctx.moveTo(x, 0);
					ctx.lineTo(x, H);
					ctx.stroke();
				}
				ctx.save();
				ctx.shadowColor = "#ff4d6d";
				ctx.shadowBlur = 12;
				ctx.fillStyle = "#ff4d6d";
				for (const b of blocks) {
					ctx.beginPath();
					ctx.roundRect(
						laneX(b.lane) - BLOCK / 2,
						b.y - BLOCK / 2,
						BLOCK,
						BLOCK,
						8,
					);
					ctx.fill();
				}
				ctx.restore();
				// gems: spinning diamonds
				for (const g of gems) {
					const x = laneX(g.lane);
					const s = 12 * (0.75 + Math.abs(Math.sin(now / 180)) * 0.25);
					ctx.save();
					ctx.shadowColor = "#00e5ff";
					ctx.shadowBlur = 16;
					ctx.fillStyle = "#00e5ff";
					ctx.beginPath();
					ctx.moveTo(x, g.y - 14);
					ctx.lineTo(x + s, g.y);
					ctx.lineTo(x, g.y + 14);
					ctx.lineTo(x - s, g.y);
					ctx.closePath();
					ctx.fill();
					ctx.restore();
				}
				if (state === "run" || state === "won") {
					const py = playerY();
					// speed streaks behind the runner
					ctx.strokeStyle = "rgba(0,229,255,0.35)";
					ctx.lineWidth = 3;
					for (let i = 0; i < 3; i++) {
						const off = ((now / 6 + i * 22) % 60) + 18;
						ctx.beginPath();
						ctx.moveTo(px + (i - 1) * 8, py + off);
						ctx.lineTo(px + (i - 1) * 8, py + off + 10);
						ctx.stroke();
					}
					ctx.save();
					ctx.shadowColor = "#00e5ff";
					ctx.shadowBlur = 20;
					ctx.fillStyle = ink;
					ctx.beginPath();
					ctx.arc(px, py, PR, 0, Math.PI * 2);
					ctx.fill();
					ctx.restore();
				}
				for (const s of shards) {
					if (s.life <= 0) continue;
					ctx.globalAlpha = Math.min(s.life * 1.4, 1);
					ctx.fillStyle = Math.random() < 0.5 ? "#00e5ff" : ink;
					ctx.fillRect(s.x - 3, s.y - 3, 6, 6);
				}
				ctx.globalAlpha = 1;
			}

			function steer(d) {
				if (state !== "run" || !playdeck.running) return;
				const next = Math.min(Math.max(lane + d, 0), 2);
				if (next === lane) return;
				prevLane = lane;
				lane = next;
				laneChangedAt = t;
				playdeck.sfx("step");
			}

			canvas.addEventListener("pointerdown", (e) =>
				steer(e.clientX < W / 2 ? -1 : 1),
			);
			addEventListener("keydown", (e) => {
				const k = e.key;
				if (k === "ArrowLeft" || k === "a" || k === "A") {
					e.preventDefault();
					steer(-1);
				} else if (k === "ArrowRight" || k === "d" || k === "D") {
					e.preventDefault();
					steer(1);
				}
			});
		</script>
	</body>
</html>
