<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="playdeck:title" content="Echo Pads" />
		<meta name="playdeck:emoji" content="🎵" />
		<meta
			name="playdeck:desc"
			content="Watch the pattern. Play it back. It only gets longer."
		/>
		<meta name="playdeck:order" content="5" />
		<meta name="playdeck:accent" content="#7c5cff" />
		<meta
			name="playdeck:instructions"
			content="Watch the pads light up, then repeat the pattern before the timer drains (keys 1–4 work too). Each round adds one more step."
		/>
		<style>
			:root {
				--accent: #7c5cff;
			}
			/* ---- shared arcade layout: combo, per-answer timer, tiles ---- */
			#game {
				position: absolute;
				inset: 92px 16px 92px;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
			}
			#combo {
				display: flex;
				align-items: baseline;
				gap: 10px;
				height: 56px;
				font-weight: 900;
				color: var(--t-muted);
				transition: color 0.2s;
			}
			#combo b {
				display: inline-block;
				font-size: 50px;
				line-height: 1;
			}
			#combo span {
				font-size: 13px;
				letter-spacing: 0.2em;
			}
			#combo.hot {
				color: var(--accent);
				text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
			}
			#combo.bump b {
				animation: bump 0.35s cubic-bezier(0.3, 1.8, 0.5, 1);
			}
			@keyframes bump {
				from {
					transform: scale(1.8);
				}
			}
			#tbar {
				width: min(84vw, 400px);
				height: 8px;
				border-radius: 99px;
				background: color-mix(in srgb, var(--t-line) 80%, transparent);
				overflow: hidden;
				transition: opacity 0.2s;
			}
			#tbar i {
				display: block;
				height: 100%;
				background: var(--accent);
				border-radius: inherit;
				transform-origin: left;
			}
			#tbar.low i {
				background: var(--t-danger);
			}
			#tbar.off {
				opacity: 0.3;
			}
			.tile {
				animation: pin 0.3s cubic-bezier(0.3, 1.6, 0.5, 1) both;
				animation-delay: calc(var(--i, 0) * 30ms);
			}
			@keyframes pin {
				from {
					transform: scale(0.2);
					opacity: 0;
				}
			}
			.tile.hit {
				animation: hit 0.25s ease-out;
			}
			@keyframes hit {
				40% {
					transform: scale(1.14);
				}
			}
			.tile.wrong {
				animation: wrong 0.4s;
			}
			/* only a tapped button turns red; text and grids just shake */
			button.wrong {
				border-color: var(--t-danger) !important;
				background: color-mix(
					in srgb,
					var(--t-danger) 40%,
					transparent
				) !important;
			}
			@keyframes wrong {
				20% {
					transform: translateX(-10px);
				}
				40% {
					transform: translateX(9px);
				}
				60% {
					transform: translateX(-6px);
				}
				80% {
					transform: translateX(4px);
				}
			}

			/* ---- this game ---- */
			#status {
				font-size: 14px;
				font-weight: 900;
				letter-spacing: 0.3em;
				height: 18px;
				color: var(--t-muted);
			}
			#status.go {
				color: var(--accent);
			}
			#pads {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 14px;
				margin-top: 6px;
			}
			.pad {
				width: min(36vw, 150px, calc((100vh - 360px) / 2));
				aspect-ratio: 1;
				padding: 0;
				border: 2px solid var(--t-line);
				border-radius: 26px;
				background: var(--c);
				opacity: 0.6;
				cursor: pointer;
				transition:
					opacity 0.1s,
					box-shadow 0.1s,
					scale 0.1s;
			}
			.pad.lit {
				opacity: 1;
				scale: 1.06;
				box-shadow: 0 0 44px var(--c);
			}
			.pad.right {
				opacity: 1;
				border-color: var(--t-text);
				box-shadow: 0 0 0 4px var(--t-good);
			}
		</style>
	</head>
	<body>
		<div id="game">
			<div id="combo" aria-live="polite"></div>
			<div id="tbar" class="off"><i></i></div>
			<div id="status" aria-live="polite"></div>
			<div id="pads">
				<button
					class="pad"
					type="button"
					aria-label="Purple pad (1)"
					style="--c: #7c5cff"
				></button>
				<button
					class="pad"
					type="button"
					aria-label="Cyan pad (2)"
					style="--c: #00e5ff"
				></button>
				<button
					class="pad"
					type="button"
					aria-label="Pink pad (3)"
					style="--c: #ff5cd0"
				></button>
				<button
					class="pad"
					type="button"
					aria-label="Green pad (4)"
					style="--c: #3dffa0"
				></button>
			</div>
		</div>
		<script>
			// ---------- shared arcade kit (combo, per-answer timer, juice) ----------
			const $ = (id) => document.getElementById(id);
			const ACCENT = "#7c5cff",
				GOLD = "#ffd24d";
			const comboEl = $("combo"),
				barEl = $("tbar"),
				barFill = barEl.firstElementChild;
			let state = "idle"; // idle | play (answer clock running) | wait | over
			let timers = [],
				raf = 0;
			let score = 0,
				streak = 0,
				best = 0;
			let limit = 1,
				askedAt = 0; // per-answer clock: seconds allowed, start time (ms)

			const after = (ms, fn) => timers.push(setTimeout(fn, ms));
			function clearAll() {
				timers.forEach(clearTimeout);
				timers = [];
				cancelAnimationFrame(raf);
			}
			function center(el) {
				const r = el.getBoundingClientRect();
				return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
			}
			function retrigger(el, cls) {
				el.classList.remove(cls);
				void el.offsetWidth; // restart the CSS animation
				el.classList.add(cls);
			}
			// ×1 → ×5, one step every 3 answers in a row
			const mult = () => Math.min(1 + Math.floor(streak / 3), 5);
			function drawCombo(bump) {
				comboEl.innerHTML = `<b>×${mult()}</b><span>STREAK ${streak}</span>`;
				comboEl.className = (mult() > 1 ? "hot " : "") + (bump ? "bump" : "");
			}
			function arm(seconds) {
				limit = seconds;
				askedAt = performance.now();
				barEl.classList.remove("off", "low");
				barFill.style.transform = "scaleX(1)";
				state = "play";
			}
			function loop(now) {
				if (state === "idle") return;
				if (state === "play") {
					const left = 1 - (now - askedAt) / 1000 / limit;
					barFill.style.transform = `scaleX(${Math.max(left, 0)})`;
					barEl.classList.toggle("low", left < 0.3);
					if (left <= 0) timeout();
				}
				raf = requestAnimationFrame(loop);
			}
			// Correct answer: score with the streak multiplier, +N pop, burst, FAST!
			function reward(el, base, color = ACCENT, sound = true) {
				const took = (performance.now() - askedAt) / 1000;
				const fast = took < limit * 0.35;
				const before = mult();
				streak += 1;
				best = Math.max(best, streak);
				const pts = base * mult() + (fast ? 5 : 0);
				score += pts;
				const { x, y } = center(el);
				if (sound) playdeck.sfx("merge", 2 ** Math.min(streak + 1, 11)); // pitch climbs with the streak
				playdeck.pop(x, y - 10, `+${pts}`, color);
				playdeck.burst(x, y, color, 10 + mult() * 3);
				if (fast) after(100, () => playdeck.pop(x, y - 50, "FAST!", GOLD));
				if (mult() > before) {
					const c = center(comboEl);
					playdeck.pop(c.x, c.y + 40, `×${mult()} COMBO!`, ACCENT);
				}
				retrigger(el, "hit");
				drawCombo(true);
				state = "wait";
				barEl.classList.add("off");
				return fast;
			}
			// Fatal mistake: shake, let it register for a beat, then end.
			function fail(el, note) {
				state = "over";
				barEl.classList.add("off");
				playdeck.sfx("bad");
				if (el) retrigger(el, "wrong");
				after(750, () => {
					state = "idle";
					playdeck.end(false, score, note);
				});
			}
			function win(bonus, note) {
				state = "over";
				score += bonus;
				barEl.classList.add("off");
				playdeck.flash(ACCENT);
				playdeck.sfx("good");
				after(400, () => {
					state = "idle";
					playdeck.end(true, score, note);
				});
			}

			// ---------- Echo Pads ----------
			const PAD_COLORS = ["#7c5cff", "#00e5ff", "#ff5cd0", "#3dffa0"];
			const FREQ = [261.6, 329.6, 392.0, 523.3];
			const pads = [...document.querySelectorAll(".pad")];
			const statusEl = $("status");
			let L = 1,
				target = 0,
				stepMs = 600,
				seq = [],
				pos = 0;

			// Each pad has its own note — the tune is half the memory aid. It
			// plays through the app's audio so the mute toggle applies.
			function tone(i, ms) {
				playdeck.tone(FREQ[i], ms / 1000);
			}
			function light(i, ms) {
				pads[i].classList.add("lit");
				tone(i, ms);
				after(ms, () => pads[i].classList.remove("lit"));
			}

			function setStatus(text, go) {
				statusEl.textContent = text;
				statusEl.className = go ? "go" : "";
			}
			function hud() {
				playdeck.hud({
					chips: [
						`SEQ ${Math.min(seq.length, target)}/${target}`,
						`${score} PTS`,
					],
				});
			}
			const tapWindow = () => Math.max(2.4 - L * 0.08, 1.3);

			// Add a step, play the whole sequence back, then open the input window.
			function nextRound() {
				seq.push((Math.random() * 4) | 0);
				state = "wait";
				barEl.classList.add("off");
				setStatus("WATCH", false);
				hud();
				seq.forEach((p, i) =>
					after(350 + i * stepMs, () => light(p, stepMs * 0.55)),
				);
				after(350 + seq.length * stepMs - stepMs * 0.3, () => {
					pos = 0;
					setStatus("YOUR TURN", true);
					arm(tapWindow() + 0.4);
				});
			}

			function tap(i) {
				if (!playdeck.running || state !== "play") return;
				light(i, 180);
				const pad = pads[i];
				if (i !== seq[pos]) {
					pads[seq[pos]].classList.add("right");
					return fail(pad, `Wrong pad on step ${pos + 1}`);
				}
				pos += 1;
				reward(pad, 3, PAD_COLORS[i], false);
				if (pos < seq.length) {
					arm(tapWindow());
					return;
				}
				// sequence complete
				if (seq.length >= target)
					return win(20 + seq.length * 3, `Echoed all ${target}!`);
				const { x, y } = center($("pads"));
				playdeck.sfx("good");
				playdeck.pop(
					x,
					y,
					seq.length >= target - 1 ? "LAST ONE!" : "NICE!",
					ACCENT,
				);
				setStatus("", false);
				after(650, nextRound);
			}

			function timeout() {
				pads[seq[pos]].classList.add("right");
				fail(statusEl, "Too slow");
			}

			$("pads").addEventListener("pointerdown", (e) => {
				const p = e.target.closest(".pad");
				if (p) tap(pads.indexOf(p));
			});
			document.addEventListener("keydown", (e) => {
				const i = ["1", "2", "3", "4"].indexOf(e.key);
				if (i < 0) return;
				e.preventDefault();
				tap(i);
			});

			playdeck.onStart(({ level }) => {
				clearAll();
				L = Math.min(Math.max(level, 1), 10);
				target = Math.min(4 + L, 12);
				stepMs = Math.max(600 - L * 35, 300);
				// open with two steps so the first round isn't dead time
				seq = [(Math.random() * 4) | 0];
				score = streak = best = pos = 0;
				for (const [i, p] of pads.entries()) {
					p.className = "pad";
					p.style.setProperty("--i", i);
					retrigger(p, "tile");
				}
				drawCombo(false);
				after(300, nextRound);
				state = "wait";
				raf = requestAnimationFrame(loop);
			});

			playdeck.onStop(() => {
				clearAll();
				state = "idle";
				barEl.classList.add("off");
				setStatus("", false);
				for (const p of pads) p.className = "pad";
			});
		</script>
	</body>
</html>
