<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="playdeck:title" content="Beat Ring" />
		<meta name="playdeck:emoji" content="🥁" />
		<meta
			name="playdeck:desc"
			content="Notes fly in on the beat. Tap as they hit the ring."
		/>
		<meta name="playdeck:order" content="5" />
		<meta name="playdeck:accent" content="#ffd24d" />
		<meta
			name="playdeck:instructions"
			content="Tap anywhere (or press Space) the moment a note crosses the ring. Nail the timing for PERFECT. Three misses and you're out."
		/>
		<style>
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
			#combo {
				position: fixed;
				left: 50%;
				top: 50%;
				transform: translate(-50%, -50%);
				font:
					800 44px/1 system-ui,
					sans-serif;
				color: var(--t-text, #fff);
				text-align: center;
				pointer-events: none;
				opacity: 0;
				transition: opacity 0.15s;
			}
			#combo small {
				display: block;
				font-size: 11px;
				letter-spacing: 0.2em;
				opacity: 0.6;
				margin-top: 4px;
			}
			#combo.bump {
				animation: bump 0.18s ease-out;
			}
			@keyframes bump {
				from {
					transform: translate(-50%, -50%) scale(1.35);
				}
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<div id="combo"></div>
		<script>
			const canvas = document.getElementById("c");
			const ctx = canvas.getContext("2d");
			const comboEl = document.getElementById("combo");
			const GOLD = "#ffd24d";
			const NOTE_COLORS = ["#00e5ff", "#ff5cd0", "#3dffa0"];
			let W = 0,
				H = 0,
				dpr = 1,
				cx = 0,
				cy = 0,
				R = 60,
				speed = 1;
			let raf = 0,
				state = "idle";
			// run state
			let t = 0, // song clock in seconds
				beat = 0.6,
				travel = 1.5,
				perfectWin = 0.07,
				goodWin = 0.15,
				restChance = 0.2,
				doubleChance = 0,
				nextBeat = 0,
				beat0 = 0, // time of the first beat, anchors the metronome
				rested = false;
			let notes = [],
				goal = 0,
				hits = 0,
				lives = 3,
				misses = 0,
				combo = 0,
				maxCombo = 0,
				score = 0,
				pulse = 0,
				redFlash = 0,
				beatPulse = 0;

			function resize() {
				dpr = Math.min(devicePixelRatio || 1, 2);
				W = innerWidth;
				H = innerHeight;
				canvas.width = W * dpr;
				canvas.height = H * dpr;
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				cx = W / 2;
				cy = H / 2;
				R = Math.max(48, Math.min(Math.min(W, H - 180) * 0.18, 90));
				// constant inward speed: a note from the farthest corner arrives in `travel` s
				speed = (Math.hypot(W, H) / 2 - R) / travel;
			}
			addEventListener("resize", resize);
			resize();

			function hud() {
				playdeck.hud({
					chips: [`🥁 ${hits}/${goal}`, "❤️".repeat(lives)],
					progress: hits / goal,
				});
			}

			function showCombo() {
				comboEl.innerHTML = combo >= 2 ? `${combo}<small>COMBO</small>` : "";
				comboEl.style.opacity = combo >= 2 ? "1" : "0";
				comboEl.classList.remove("bump");
				void comboEl.offsetWidth; // restart the bump animation
				comboEl.classList.add("bump");
			}

			playdeck.onStart(({ level }) => {
				const L = Math.min(Math.max(level, 0), 12);
				beat = 60 / Math.min(96 + L * 5, 150);
				travel = Math.max(1.6 - L * 0.05, 1.05);
				perfectWin = Math.max(0.075 - L * 0.003, 0.045);
				goodWin = Math.max(0.16 - L * 0.006, 0.1);
				restChance = Math.max(0.3 - L * 0.02, 0.12);
				doubleChance = L >= 3 ? Math.min((L - 2) * 0.05, 0.3) : 0;
				goal = Math.min(16 + L * 2, 32);
				resize();
				t = 0;
				nextBeat = beat0 = travel + 0.4; // short lead-in before the first note lands
				rested = true; // never open on a rest
				notes = [];
				hits = misses = combo = maxCombo = score = 0;
				lives = 3;
				pulse = redFlash = beatPulse = 0;
				state = "run";
				hud();
				showCombo();
				cancelAnimationFrame(raf);
				let last = performance.now();
				const loop = (now) => {
					const dt = Math.min((now - last) / 1000, 0.04);
					last = now;
					step(dt);
					draw();
					if (state === "run") raf = requestAnimationFrame(loop);
				};
				raf = requestAnimationFrame(loop);
			});

			playdeck.onStop(() => {
				state = "idle";
				cancelAnimationFrame(raf);
				ctx.clearRect(0, 0, W, H);
				comboEl.style.opacity = "0";
			});

			// Schedule notes one approach-time ahead so they appear at the screen edge.
			function schedule() {
				while (nextBeat - travel < t + 0.05) {
					if (!rested && Math.random() < restChance) rested = true;
					else {
						rested = false;
						const a = Math.random() * Math.PI * 2;
						const c = NOTE_COLORS[(Math.random() * NOTE_COLORS.length) | 0];
						const dbl = Math.random() < doubleChance;
						notes.push({
							at: nextBeat,
							a,
							c: dbl ? "#ffffff" : c,
							done: false,
						});
						if (dbl)
							notes.push({
								at: nextBeat,
								a: a + Math.PI,
								c: "#ffffff",
								done: false,
							});
					}
					nextBeat += beat;
				}
			}

			const notePos = (n) => {
				const d = R + (n.at - t) * speed;
				return [cx + Math.cos(n.a) * d, cy + Math.sin(n.a) * d];
			};

			// The group = every live note landing at the same instant (doubles share `at`).
			function groupAt(at) {
				return notes.filter((n) => !n.done && n.at === at);
			}

			function judge(group, kind) {
				for (const n of group) n.done = true;
				const [x, y] = notePos(group[0]);
				if (kind === "MISS") {
					misses += 1;
					lives -= 1;
					combo = 0;
					redFlash = 1;
					playdeck.sfx("bad");
					playdeck.pop(x, y, "MISS", "#ff4d6d");
					showCombo();
					hud();
					if (lives <= 0) finish(false);
					return;
				}
				const perfect = kind === "PERFECT";
				const before = combo;
				for (const n of group) {
					combo += 1;
					hits += 1;
					score += (perfect ? 10 : 5) + Math.min(combo, 20);
					const [nx, ny] = notePos(n);
					playdeck.burst(nx, ny, perfect ? GOLD : n.c, perfect ? 16 : 7);
				}
				maxCombo = Math.max(maxCombo, combo);
				pulse = perfect ? 1 : 0.5;
				playdeck.sfx(perfect ? "good" : "hit");
				playdeck.pop(cx, cy - R - 28, kind, perfect ? GOLD : "#00e5ff");
				if (Math.floor(combo / 10) > Math.floor(before / 10))
					playdeck.flash(GOLD);
				showCombo();
				hud();
				if (hits >= goal) finish(true);
			}

			function tap() {
				if (!playdeck.running || state !== "run") return;
				const live = notes.filter((n) => !n.done);
				if (!live.length) return;
				const first = live.reduce((m, n) => (n.at < m.at ? n : m));
				const off = Math.abs(t - first.at);
				if (off <= perfectWin) judge(groupAt(first.at), "PERFECT");
				else if (off <= goodWin) judge(groupAt(first.at), "GOOD");
				// a tap well ahead of the next note is a mash — punish it so spamming fails
				else if (first.at - t < 0.35) judge(groupAt(first.at), "MISS");
			}

			document.addEventListener("pointerdown", tap);
			addEventListener("keydown", (e) => {
				if (e.code !== "Space" && e.code !== "Enter") return;
				e.preventDefault();
				if (!e.repeat) tap();
			});

			function step(dt) {
				const prev = t;
				t += dt;
				// visual metronome: ring breathes on every beat boundary
				if (
					Math.floor((prev - beat0) / beat) !== Math.floor((t - beat0) / beat)
				)
					beatPulse = 1;
				pulse = Math.max(pulse - dt * 4, 0);
				redFlash = Math.max(redFlash - dt * 3, 0);
				beatPulse = Math.max(beatPulse - dt * 5, 0);
				schedule();
				for (const n of notes) {
					if (!n.done && t - n.at > goodWin) {
						judge(groupAt(n.at), "MISS");
						if (state !== "run") return;
					}
				}
				// drop judged notes and anything long past the centre
				notes = notes.filter((n) => !n.done && t - n.at < 1);
			}

			function finish(won) {
				state = "idle";
				const full = won && misses === 0;
				if (full) score += 50;
				playdeck.end(
					won,
					score,
					full
						? "Full combo!"
						: won
							? `Best combo ${maxCombo}`
							: `Off beat at ${hits}`,
				);
			}

			function draw() {
				ctx.clearRect(0, 0, W, H);
				const r = R + pulse * 10 + beatPulse * 3;
				const col = redFlash > 0.05 ? "#ff4d6d" : GOLD;
				// timing band: how far a note can be from the ring and still count
				ctx.globalAlpha = 0.12;
				ctx.strokeStyle = GOLD;
				ctx.lineWidth = goodWin * speed * 2;
				ctx.beginPath();
				ctx.arc(cx, cy, R, 0, Math.PI * 2);
				ctx.stroke();
				// main ring
				ctx.globalAlpha = 1;
				ctx.shadowColor = col;
				ctx.shadowBlur = 18 + pulse * 30;
				ctx.strokeStyle = col;
				ctx.lineWidth = 4 + pulse * 4;
				ctx.beginPath();
				ctx.arc(cx, cy, r, 0, Math.PI * 2);
				ctx.stroke();
				// notes
				for (const n of notes) {
					const [x, y] = notePos(n);
					ctx.globalAlpha = n.at < t ? Math.max(1 - (t - n.at) * 4, 0.2) : 1;
					ctx.shadowColor = n.c;
					ctx.shadowBlur = 16;
					ctx.fillStyle = n.c;
					ctx.beginPath();
					ctx.arc(x, y, 11, 0, Math.PI * 2);
					ctx.fill();
				}
				ctx.globalAlpha = 1;
				ctx.shadowBlur = 0;
			}
		</script>
	</body>
</html>
